<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7B68EE">
  <meta name="description" content="NeuroPlan: planejador de rotina pensado para neurodivergentes.">
  <title>Nova tarefa · NeuroPlan</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="pagina-nova-tarefa">

  <!-- Ícones (sprite SVG): <svg class="icone"><use href="#i-home"/></svg> -->
  <svg xmlns="http://www.w3.org/2000/svg" hidden>
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.7 0-3 .8-4.5 2.5C10.5 3.8 9.2 3 7.5 3A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  </svg>

  <div class="app">

    <!-- Cabeçalho (igual em todas as páginas) -->
    <header class="topo">
      <a href="index.html" class="topo__logo" aria-label="NeuroPlan - ir para Hoje">
        <img src="logo-horizontal.svg" alt="NeuroPlan">
      </a>
      <div class="topo__acoes">
        <a href="configuracoes.html" class="topo__config" aria-label="Configurações"><svg class="icone" aria-hidden="true"><use href="#i-gear"/></svg></a>
        <a href="usuario.html" class="avatar avatar--pequeno" aria-label="Meu perfil">V</a>
      </div>
    </header>

    <main class="conteudo">
      <section class="tela" id="tela-nova-tarefa" aria-labelledby="nova-titulo">
        <div class="titulo-tela titulo-tela--centro">
          <p class="titulo-tela__rotulo" id="nova-rotulo">Adicionar</p>
          <h1 class="titulo-tela__titulo" id="nova-titulo">Nova Tarefa</h1>
        </div>

        <form class="formulario" id="form-tarefa" novalidate>
          <div class="campo">
            <label class="campo__rotulo" for="tarefa-nome">Nome da tarefa</label>
            <input class="campo__input" type="text" id="tarefa-nome" name="nome" placeholder="ex: Revisar Biologia" required>
          </div>

          <fieldset class="campo campo--grupo">
            <legend class="campo__rotulo">Categoria</legend>
            <div class="chips">
              <label class="chip">
                <input type="radio" name="categoria" value="aula" checked>
                <span>Aula</span>
              </label>
              <label class="chip">
                <input type="radio" name="categoria" value="afazeres">
                <span>Afazeres</span>
              </label>
              <label class="chip">
                <input type="radio" name="categoria" value="saude">
                <span>Saúde</span>
              </label>
              <label class="chip">
                <input type="radio" name="categoria" value="lazer">
                <span>Lazer</span>
              </label>
            </div>
          </fieldset>

          <fieldset class="horario">
            <div class="horario__cabecalho">
              <legend class="horario__titulo"><svg class="icone icone--roxo" aria-hidden="true"><use href="#i-clock"/></svg> Horário</legend>
              <label class="horario__data" for="tarefa-data">
                <span class="visualmente-oculto">Data da tarefa:</span>
                <span class="horario__data-texto" id="data-texto">Hoje</span>
                <svg class="icone icone--roxo" aria-hidden="true"><use href="#i-calendar"/></svg>
                <input type="date" class="horario__data-input" id="tarefa-data" name="data" required>
              </label>
            </div>
            <div class="horario__linha">
              <label class="visualmente-oculto" for="hora-inicio">Início</label>
              <input class="horario__hora" type="time" id="hora-inicio" name="inicio" value="09:00">
              <span class="horario__as">às</span>
              <label class="visualmente-oculto" for="hora-fim">Fim</label>
              <input class="horario__hora" type="time" id="hora-fim" name="fim" value="10:00">
            </div>
            <label class="horario__aviso">
              <svg class="icone icone--mini" aria-hidden="true"><use href="#i-bell"/></svg>
              <span>Avisar 10 minutos antes</span>
              <input type="checkbox" name="aviso" class="visualmente-oculto" checked>
            </label>
          </fieldset>

          <fieldset class="opcoes">
            <legend class="visualmente-oculto">Opções da tarefa</legend>
            <label class="opcao"><input type="checkbox" name="repetir"><span>Repetir toda semana</span></label>
            <label class="opcao"><input type="checkbox" name="importante"><span>Marcar como importante</span></label>
          </fieldset>

          <div class="campo">
            <label class="campo__rotulo" for="tarefa-descricao">Descrição</label>
            <textarea class="campo__input campo__input--area" id="tarefa-descricao" name="descricao" rows="6" placeholder="Adicione detalhes que te ajudem a começar..."></textarea>
          </div>

          <button type="submit" class="botao botao--principal" id="btn-salvar">Salvar tarefa</button>
          <button type="button" class="botao botao--perigo" id="btn-excluir" hidden>Excluir tarefa</button>
        </form>
      </section>
    </main>

    <!-- Menu inferior (igual em todas as páginas) -->
    <nav class="menu" aria-label="Navegação principal">
      <a href="index.html" class="menu__item">
        <svg class="icone" aria-hidden="true"><use href="#i-home"/></svg>
        <span>Hoje</span>
      </a>
      <a href="rotina.html" class="menu__item">
        <svg class="icone" aria-hidden="true"><use href="#i-calendar"/></svg>
        <span>Rotina</span>
      </a>
      <a href="nova-tarefa.html" class="menu__adicionar is-ativo" aria-current="page" aria-label="Adicionar nova tarefa">
        <svg class="icone" aria-hidden="true"><use href="#i-plus"/></svg>
      </a>
      <a href="cuidados.html" class="menu__item">
        <svg class="icone" aria-hidden="true"><use href="#i-heart"/></svg>
        <span>Cuidados</span>
      </a>
      <a href="usuario.html" class="menu__item">
        <svg class="icone" aria-hidden="true"><use href="#i-user"/></svg>
        <span>Usuário</span>
      </a>
    </nav>

  </div>
</body>
</html>
